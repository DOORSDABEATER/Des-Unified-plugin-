
name: Build DeS Unified Weapons

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed plugin source
        run: unzip -q DeS-Unified-Weapons-MERGED-CLEAN-FIXED.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build plugin
        working-directory: DeS-Unified-Weapons/plugin
        run: gradle clean build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeS-Unified-Weapons-JAR
          path: DeS-Unified-Weapons/plugin/build/libs/*.jar
          if-no-files-found: error
          
